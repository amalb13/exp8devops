permissions:
  contents: write  # allows GitHub Actions to push

name: CI/CD Pipeline

on:
  push:
    branches:
      - main  # change to 'master' if needed

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout your repo
      - name: Checkout repository
        uses: actions/checkout@v3

      # Step 2: Optional - list all files (debug)
      - name: List files
        run: ls -R

      # Step 3: Deploy the 'exp 8' folder to GitHub Pages
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./exp 8   # folder containing your index.html
          force_orphan: true      # forces a full overwrite of gh-pages branch
